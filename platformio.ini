; PEACH PULP — BigTreeTech Octopus v1.1 (STM32F446ZET6), custom FreeRTOS firmware.
; See docs/ARCHITECTURE.md. The original ESP32 firmware is preserved on the
; branches main and breaking/stem-hw-3pump.

[env:octopus_f446]
platform = ststm32
board = octopus_f446          ; custom board def in boards/octopus_f446.json
framework = arduino

; Bootloader-less: firmware is linked at 0x08000000 and DFU-flashed there,
; overwriting BTT's SD-card bootloader (unused — this rig has no microSD).
; Updates go via DFU (BOOT0 jumper J75 + reset, then dfu-util). To restore the
; SD bootloader later, DFU-flash BTT's bootload.hex at 0x08000000 first.

build_flags =
    -D HSE_VALUE=12000000L            ; Octopus v1.1 12 MHz HSE (generic clock runs off HSI; see SystemClock)
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC   ; USB CDC serial ↔ the Raspberry Pi
    -D USBCON
    -D USBD_USE_CDC
    -Isrc -Isrc/drivers

lib_deps =
    janelia-arduino/TMC2209 @ 10.1.1
    stm32duino/STM32duino FreeRTOS @ ^10.3.2

; Build: `pio run -e octopus_f446` → .pio/build/octopus_f446/firmware.bin
; Flash (DFU): fit the BOOT0 jumper (J75), hold RST ~4 s, then
;   dfu-util -a 0 -d 0483:df11 -s 0x08000000:leave -D .pio/build/octopus_f446/firmware.bin
upload_protocol = dfu
monitor_speed = 115200
