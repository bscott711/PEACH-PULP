; PEACH PULP — see docs/ARCHITECTURE.md
;
;   octopus_f446 : the target — BigTreeTech Octopus v1.1 (STM32F446ZET6), custom FreeRTOS fw
;   esp32dev     : the original ESP32 build, kept for reference during the port.
;                  It stops building once the on-device UI / NetworkManager are removed
;                  (Phase 3+). The working ESP32 firmware lives on main / breaking/stem-hw-3pump.

; ===========================================================================
[env:octopus_f446]
platform = ststm32
board = genericSTM32F446ZE
framework = arduino

; BTT Octopus ships a 32 KiB DFU bootloader; the app runs from 0x08008000.
board_build.offset = 0x8000
board_upload.offset_address = 0x08008000

; USB CDC = the serial link to the Raspberry Pi (appears as /dev/ttyACM0).
build_flags =
    -D HSE_VALUE=12000000L            ; Octopus v1.1 has a 12 MHz HSE crystal — verify vs schematic
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D configTICK_RATE_HZ=1000
    -Isrc -Isrc/drivers

lib_deps =
    janelia-arduino/TMC2209 @ 10.1.1
    stm32duino/STM32duino FreeRTOS

; Flashing: `pio run -e octopus_f446` then copy .pio/build/octopus_f446/firmware.bin to the
; Octopus microSD and power-cycle. DFU alternative (BOOT0 jumper):
upload_protocol = dfu
monitor_speed = 115200

; ===========================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200

; --- Upload Method ---
; USB upload (comment the two lines below to fall back to USB)
upload_protocol = espota
upload_port = peach-stem.local

build_flags = -Isrc -Isrc/drivers

lib_deps =
    janelia-arduino/TMC2209 @ 10.1.1
    olikraus/U8g2 @ ^2.34.22
    adafruit/Adafruit seesaw Library @ ^1.7.9
